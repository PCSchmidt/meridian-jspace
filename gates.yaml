# meridian-jspace — portfolio-kit contract 0.1.0

version: "1.0"

project:
  name: "meridian-jspace"
  recipe: "custom"
  description: "Phase 1 mechanical J-space readout of Evaluator rejects"

gates:
  - id: confirmed
    label: "Scope Confirmed"
    type: human_approval
    required: true
    approval_token: "CONFIRMED"
    requires: []
    requires_artifacts:
      - CONTRACT.md
      - SPEC.md
    hooks:
      pre:
        - artifacts_exist
    emits: CONFIRMED_GATE.json
    on_fail: block_all_writes

  - id: tests_passing
    label: "Tests Passing"
    type: automated
    required: true
    requires:
      - confirmed
    hooks:
      pre:
        - tests_exist
    requires_artifacts:
      - tests
    emits: TEST_GATE.json
    on_fail: block_gate_writes

  - id: evaluated
    label: "Independent Evaluator Pass"
    type: automated
    required: true
    requires:
      - tests_passing
    hooks:
      pre:
        - eval_exists
    emits: EVALUATOR_GATE.json
    on_fail: block_all_writes
